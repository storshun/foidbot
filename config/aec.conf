# Echo-cancelled microphone for foidbot, run as its own small PipeWire client (foidbot-aec.service) so the main
# audio server never needs a restart. It listens to whatever the default output plays (monitor mode) and removes
# that from the default mic, exposing the result as the source "foidbot_aec_source". Nothing else changes.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = { node.name = "foidbot_aec_capture" node.passive = true }
            source.props  = { node.name = "foidbot_aec_source" node.description = "foidbot echo-cancelled mic" }
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = false
                webrtc.voice_detection = false
            }
        }
    }
]
